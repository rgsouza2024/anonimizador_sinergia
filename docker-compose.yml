services:
  # Serviço padrão: Motor de anonimização isolado via REST API (Porta 8000)
  api-anonimizador:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonimizador_sinergia_api
    command: ["python", "api_anonimizador.py"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Serviço alternativo: Aplicação completa (Frontend SPA + Gradio + API na Porta 7860)
  # Execução: docker compose --profile full up app-completo
  app-completo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonimizador_sinergia_full
    command: ["python", "app.py"]
    ports:
      - "7860:7860"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    profiles:
      - full
